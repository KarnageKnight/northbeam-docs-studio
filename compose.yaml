name: northbeam-docs-studio

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northbeam}
      POSTGRES_USER: ${POSTGRES_USER:-northbeam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northbeam_local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
