name: northbeam-docs-studio

services:
  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-northbeam}:${POSTGRES_PASSWORD:-northbeam_local}@db:5432/${POSTGRES_DB:-northbeam}}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northbeam}
      POSTGRES_USER: ${POSTGRES_USER:-northbeam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northbeam_local}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-db:
    profiles: [test]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: northbeam_test
      POSTGRES_USER: northbeam_test
      POSTGRES_PASSWORD: northbeam_test_local
    volumes:
      - test_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U northbeam_test -d northbeam_test"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  test-runner:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://northbeam_test:northbeam_test_local@test-db:5432/northbeam_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
  test_postgres_data:
