    :root {
      --accent: #86bc25;
      --accent-hover: #77a820;
      --ink: #11150e;
      --link: #046a38;
      --paper: #ffffff;
    }
    .artboard { border-radius: 12px; box-shadow: 0 16px 48px #15200d12; }
    .app-header { background: #000; border-bottom: 1px solid #30382a; padding-top: 22px; padding-bottom: 22px; }
    .brand { color: #fff; font-size: 17px; letter-spacing: -.5px; }
    .mark { background: var(--accent); color: #000; border-radius: 7px; font-size: 19px; font-weight: 750; width: 34px; height: 34px; }
    .app-nav a { color: #c8d0c2; padding-block: 9px; border-bottom: 2px solid transparent; }
    .app-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
    .content { padding: 36px 40px 44px; }
    .page-heading h1, .form-page h1 { font-size: 35px; letter-spacing: -1.3px; }
    .eyebrow { color: var(--link); font-weight: 700; letter-spacing: .13em; margin-bottom: 8px; }
    .button { border-radius: 7px; transition: background-color .12s, border-color .12s; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: #000; box-shadow: 0 2px 4px #18210e0a; }
    .button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .button:disabled { background: #e4e8de; border-color: #e4e8de; color: #64705a; }
    .surface { border-radius: 10px; box-shadow: 0 3px 12px #15200d04; }
    .editor-heading { padding: 27px 30px; background: #10130d; color: #fff; border-left: 4px solid var(--accent); border-radius: 10px; margin-bottom: 25px; }
    .editor-title h1 { color: #fff; font-size: 34px; font-weight: 650; letter-spacing: -1px; }
    .editor-heading .metadata { color: #b6c1ac; margin-top: 15px; }
    .editor-heading .metadata code { color: #e1e8d9; }
    .editor-heading .badge.published { background: #253719; color: #c6eb94; border: 1px solid #3a5328; }
    .editor-heading .badge.draft { background: #253719; color: #c6eb94; }
    .editor-box { padding: 28px; }
    .field label { font-weight: 650; }
    .field input { border-radius: 7px; background: #fff; }
    .field input:focus { border-color: var(--link); }
    .pane { border-radius: 8px; }
    .editor-tabs { background: #f3f6ee; padding-inline: 14px; }
    .editor-tabs [role=tab][aria-selected=true] { color: var(--ink); border-bottom: 3px solid var(--accent); }
    .tabbed .source { background: #fdfefb; }
    .tabbed .prose { background: #fff; }
    .history-row.selected { background: #f0f7e4; box-shadow: inset 3px 0 var(--accent); }
    .history-row button { min-height: 44px; color: var(--link); font-weight: 600; }
    .badge.published { background: #eaf5d9; color: #355811; }
    .badge.draft { background: #f1f4ed; color: #48583d; }
    .tag { background: #f0f5e8; color: #3e5230; border: 1px solid #e0e9d2; }
    .article-row:hover, .public-row:hover { background: #fafcf6; }
    .public-heading { border-top: 4px solid var(--accent); padding-top: 24px; margin-bottom: 8px; }
    .public-heading h1 { font-size: 40px; }
    .reading .article-title { font-size: 40px; letter-spacing: -1.4px; }
    .reading .byline { border-bottom-color: #cdd9bc; }
    .callout { border-left-color: var(--accent); background: #f2f8e9; color: #345522; }
    @container (max-width: 900px) { .content { padding: 28px; } }
    @container (max-width: 550px) {
      .content { padding: 24px 18px 30px; }
      .brand { font-size: 16px; }
      .editor-heading { padding: 22px 20px; }
      .editor-title h1 { font-size: 28px; }
      .editor-box, .form-box { padding: 18px; }
      .page-heading h1, .form-page h1 { font-size: 29px; }
      .public-heading h1, .reading .article-title { font-size: 32px; }
    }
    .portal-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #1b2116;
      border: 1px solid #3b4631;
      border-radius: 9px;
    }
    .portal-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 86px;
      padding: 10px 18px;
      border-radius: 6px;
      color: #d7dfcf;
      font-size: 13px;
      font-weight: 600;
    }
    .portal-link:hover { color: #fff; background: #303b25; text-decoration: none; }
    .portal-link[aria-current] { color: #000; background: var(--accent); }
    .portal-link[aria-current]:hover { background: var(--accent-hover); }

<body>
  <header class="review">
    <div class="review-title"><div><h1>Northbeam · UI design review</h1><p>Approved article UI preview</p></div><div class="review-note">Sample content only. These screens do not connect to the application or save data.</div></div>
    <div class="controls">
      <div class="control"><span>Canvas</span><div class="segments" id="widths"><button data-width="desktop">Desktop</button><button data-width="mobile">Mobile</button></div></div>
      <label class="control"><span>Feedback state</span><select id="state"><option value="normal">Normal</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="validation">Validation error</option><option value="success">Success</option><option value="conflict">Stale revision</option><option value="protected">Protected version</option><option value="error">Request failure</option><option value="missing">Not found</option></select></label>
    </div>
    <nav class="screens" aria-label="Mockup screen"><button data-screen="writer">Writer list</button><button data-screen="create">Create draft</button><button data-screen="editor">Editor & history</button><button data-screen="public">Public list</button><button data-screen="article">Public article</button></nav>
  </header>
  <div class="stage" id="stage"><div class="artboard" id="artboard"><header class="app-header" id="app-header"></header><main class="content" id="screen"></main></div><div class="preview-footer" id="caption"></div></div>
  <div id="message" class="review-message" role="status" hidden></div>
  <script>
    const params = new URLSearchParams(location.search)
    const options = { tab: params.get('tab') === 'preview' ? 'preview' : 'write', width: params.get('width') === 'mobile' ? 'mobile' : 'desktop', screen: ['writer','create','editor','public','article'].includes(params.get('screen')) ? params.get('screen') : 'editor', state: 'normal' }
    const $ = id => document.getElementById(id)
    const button = (text, action, style='') => `<button class="button ${style}" data-demo="${action}">${text}</button>`
    const nav = (text, screen, style='') => `<a href="#${screen}" data-go="${screen}" class="${style}">${text}</a>`
    const badge = (text, type) => `<span class="badge ${type}"><span class="dot"></span>${text}</span>`
    const tags = () => '<span class="tag">ideas</span><span class="tag">everyday-life</span>'
    const markdown = "# Small moments, new ideas\n\nA fresh perspective often begins\nwith the ordinary.\n\n## Make room for curiosity\n\n1. Notice something you usually overlook\n2. Ask a different question\n3. Write down what you discover\n\nInspiration can come from a conversation,\na walk, or a moment of quiet."
    const prose = () => "<h2>Small moments, new ideas</h2><p>A fresh perspective often begins with the ordinary.</p><h3>Make room for curiosity</h3><ol><li>Notice something you usually overlook</li><li>Ask a different question</li><li>Write down what you discover</li></ol><p>Inspiration can come from a conversation, a walk, or a moment of quiet.</p>"
    function notice() {
      const state = options.state
      if (state==='conflict') return '<div class="notice" role="alert"><span class="symbol">!</span><div><strong>This article changed in another tab or session.</strong><p>Your local text is still here. Reload the saved article before resubmitting.</p>'+button('Reload saved article','reload')+'</div></div>'
      if (state==='success') return '<div class="notice success" role="status"><span class="symbol">✓</span><div><strong>'+ (options.screen==='create' ? 'Draft created.' : 'Draft saved.') +'</strong><p>Your changes have been saved. Public content is unchanged.</p></div></div>'
      if (state==='validation') return '<div class="notice error" role="alert"><span class="symbol">!</span><div><strong>Check the highlighted fields.</strong><p>Your text has been kept. Correct the errors and try again.</p></div></div>'
      if (state==='error') return '<div class="notice error" role="alert"><span class="symbol">!</span><div><strong>Something went wrong.</strong><p>We could not load this content. Please try again.</p>'+button('Retry','retry')+'</div></div>'
      return ''
    }
    function empty(title, text, create=false) { return `<div class="surface empty"><h2>${title}</h2><p>${text}</p>${create ? '<div class="actions">'+nav('+ New article','create','button primary')+'</div>' : ''}</div>` }
    function writer() {
      return '<div class="page-heading"><div><p class="eyebrow">Workspace</p><h1>Writer articles</h1><p class="muted">Open an article to work on its draft.</p></div>'+nav('+ New article','create','button primary')+'</div>'+notice()+ (options.state==='empty' ? empty('No articles yet','Create your first draft to get started.',true) : '<section class="surface" aria-label="Writer articles"><div class="list-head"><span>Draft title</span><span>Status</span><span></span></div>'+[['Finding inspiration','Published'],['A walk without a plan','Published'],['The art of starting small','Published'],['A fresh perspective','Draft'],['A quieter weekend','Unpublished']].map(([title,status])=>'<div class="article-row">'+nav(title,'editor')+badge(status,status.toLowerCase())+nav('Open →','editor','open')+'</div>').join('')+'</section><p class="list-foot">Titles reflect your saved drafts.</p>')
    }
    function create() {
      const invalid=options.state==='validation'
      return '<div class="form-page">'+nav('← Writer articles','writer','back')+'<h1>New article</h1><p class="muted">Start with a title and a permanent URL.</p>'+notice()+'<form class="surface form-box" id="create-form"><div class="field"><label for="create-title">Title</label><input id="create-title" value="Finding inspiration" aria-describedby="title-hint"><span id="title-hint" class="hint">Required. Up to 200 Unicode characters.</span></div><div class="field"><label for="create-slug">Slug</label><input id="create-slug" value="finding-inspiration" aria-invalid="'+invalid+'" aria-describedby="slug-hint'+(invalid ? ' slug-error' : '')+'"><span id="slug-hint" class="hint">Lowercase letters, numbers, and single hyphens. Up to 100 characters.<br>The slug cannot change after creation.</span>'+(invalid ? '<span id="slug-error" class="error-text">This slug is already in use. Choose another.</span>' : '')+'</div><div class="actions form-actions"><button class="button primary" type="submit">Create draft</button>'+nav('Cancel','writer','button quiet')+'</div></form></div>'
    }
    function editorBody() {
      return `<div class="workbench"><div class="pane tabbed">
        <div class="editor-tabs">
          <div role="tablist" aria-label="Markdown editor">
            <button type="button" id="write-tab" role="tab" aria-controls="write-panel" data-editor-tab="write" aria-selected="true" tabindex="0">Write</button>
            <button type="button" id="preview-tab" role="tab" aria-controls="preview-panel" data-editor-tab="preview" aria-selected="false" tabindex="-1">Preview</button>
          </div>
          <span class="hint" id="tab-caption">Markdown</span>
        </div>
        <section id="write-panel" role="tabpanel" aria-labelledby="write-tab" tabindex="0">
          <label for="source" class="sr-only">Markdown body</label>
          <textarea class="source" id="source" spellcheck="false">${markdown}</textarea>
        </section>
        <section id="preview-panel" role="tabpanel" aria-labelledby="preview-tab" tabindex="0" hidden>
          <div class="prose">${prose()}</div>
        </section>
      </div></div>`
    }
    function setEditorTab(tab, focus=false) {
      options.tab=tab
      for (const name of ['write','preview']) {
        const selected=name===tab
        const control=$(name+'-tab'),panel=$(name+'-panel')
        if (!control || !panel) return
        control.setAttribute('aria-selected',String(selected))
        control.tabIndex=selected?0:-1
        panel.hidden=!selected
        if (selected && focus) control.focus()
      }
      $('tab-caption').textContent=tab==='write'?'Markdown':'Local draft'
      const query=new URLSearchParams(location.search);query.set('tab',tab)
      history.replaceState(null,'','?'+query)
    }
    function editor() {
      const protectedVersion=options.state==='protected', saved=options.state==='success', invalid=options.state==='validation', neverPublished=options.state==='empty'
      return nav('← Writer articles','writer','back')+'<div class="editor-heading"><div class="editor-title"><h1>Finding inspiration</h1>'+badge(neverPublished ? 'Draft' : 'Published',neverPublished ? 'draft' : 'published')+'</div><div class="metadata"><span>Slug: <code>finding-inspiration</code> · fixed</span>'+(neverPublished ? '' : '<span>First published Nov 7, 2026</span>')+'</div></div>'+notice()+'<section class="surface editor-box" aria-label="Draft editor"><div class="editor-fields"><div class="field"><label for="draft-title">Title</label><input id="draft-title" value="'+(invalid ? '' : 'Finding inspiration')+'" '+(invalid ? 'aria-invalid="true" aria-describedby="draft-error"' : '')+'>'+(invalid ? '<span id="draft-error" class="error-text">A nonblank title is required.</span>' : '')+'</div><div class="field"><label for="draft-tags">Tags</label><input id="draft-tags" value="ideas, everyday-life" aria-describedby="tag-hint"><span id="tag-hint" class="hint">Comma-separated. Up to 10 tags.</span></div></div>'+editorBody()+'<div class="editor-footer"><span class="dirty">'+(saved ? '<span style="color:#166534">✓ All changes saved</span>' : '<span class="dot"></span> Unsaved changes')+'</span><div class="actions">'+button('Save draft','save','primary')+'<button class="button" data-demo="publish" '+(saved ? '' : 'disabled aria-describedby="publish-reason"')+'>Publish</button>'+(neverPublished ? '' : button('Unpublish','unpublish'))+'</div></div>'+(!saved ? '<p class="save-reason" id="publish-reason">Save your changes before publishing. Your live article is unchanged.</p>' : '')+'</section><div class="section-heading"><h2>Version history</h2><span>Newest first · immutable snapshots</span></div>'+(options.state==='empty' ? empty('No published versions yet','Publishing creates the first version of your article.') : '<section class="surface" aria-label="Version history">'+[3,2,1].map(n=>'<div class="history-row '+((protectedVersion ? n===3 : n===2) ? 'selected' : '')+'"><strong>Version '+n+'</strong>'+(n===3 ? badge('Current published','protected') : '<span class="hint">Snapshot</span>')+'<button data-demo="inspect'+n+'">Inspect →</button></div>').join('')+'<div class="snapshot"><div class="snapshot-header"><strong>Version '+(protectedVersion ? '3' : '2')+'</strong><span class="badge protected">Read-only snapshot</span></div>'+tags()+'<div class="prose"><h2>'+(protectedVersion ? 'Finding inspiration' : 'Everyday inspiration')+'</h2><p>An ordinary moment can become the beginning of a new idea. Take time to notice what is already around you.</p></div><div class="actions">'+button('Restore into draft','restore')+(protectedVersion ? '<span class="badge protected">Protected — current published version</span>' : button('Delete version','delete','danger'))+'</div><p class="hint">Restoring changes the draft only. It does not publish.</p></div></section>')
    }
    function publicList() {
      return '<div class="public-content"><div class="public-heading"><p class="eyebrow">Northbeam Docs Studio</p><h1>Articles</h1><p class="muted">Ideas, stories, and perspectives from our writers.</p></div>'+notice()+(options.state==='empty' ? empty('No published articles yet','Our writers have not published any articles yet. Check back soon.') : '<section class="surface" aria-label="Published articles">'+[['Finding inspiration',tags(),'Nov 7, 2026'],['A walk without a plan','<span class="tag">creativity</span>','Nov 6, 2026'],['The art of starting small','<span class="tag">life</span>','Nov 5, 2026']].map(([title,tag,date])=>'<article class="public-row"><div><h2>'+nav(title,'article')+'</h2>'+tag+'<p class="date">First published '+date+'</p></div>'+nav('Read article →','article','read-link')+'</article>').join('')+'</section>')+'</div>'
    }
    function article() {
      return '<article class="reading">'+nav('← All articles','public','back')+'<h1 class="article-title">Finding inspiration</h1>'+tags()+'<p class="byline">First published Nov 7, 2026</p>'+notice()+'<div class="prose">'+prose()+'<h3>Start with one observation</h3><p>Keep a short note about a place, conversation, or idea that caught your attention. Over time, these small observations can reveal something unexpected.</p><blockquote class="callout">There is no single right place to start. Follow what makes you curious.</blockquote></div></article>'
    }
    function portalNavigation() {
      const isWriter=['writer','create','editor'].includes(options.screen)
      return '<nav class="portal-switch" aria-label="Switch portal">'+[
        {name:'Public',screen:'public',active:!isWriter},
        {name:'Writer',screen:'writer',active:isWriter},
      ].map(portal=>`<a class="portal-link" href="#${portal.screen}" data-go="${portal.screen}"${portal.active?' aria-current="true"':''}>${portal.name}</a>`).join('')+'</nav>'
    }
    function render() {
      $('stage').classList.toggle('mobile',options.width==='mobile')
      $('app-header').innerHTML=nav('<span class="mark">N</span><span>Northbeam Docs Studio</span>','public','brand')+portalNavigation()
      const pages={writer,create,editor,public:publicList,article}
      if(options.state==='missing') $('screen').innerHTML=empty(options.screen==='article' ? 'Article not found' : 'Content not found','This content is unavailable. Return to the list to continue.')+'<div class="actions" style="justify-content:center;margin-top:18px">'+nav('← Back to articles',options.screen==='article' ? 'public' : 'writer','button')+'</div>'
      else if(options.state==='error') $('screen').innerHTML=notice()
      else if(options.state==='loading') $('screen').innerHTML='<div class="page-heading"><h1>Loading '+(['writer','public'].includes(options.screen) ? 'articles' : 'draft')+'…</h1></div><div class="surface skeleton" role="status"><div class="loader"></div><div class="loader"></div><div class="loader"></div><span class="muted">Please wait while your content loads.</span></div>'
      else $('screen').innerHTML=pages[options.screen]()
      document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.width===options.width))
      document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.screen===options.screen))
      const states={writer:['normal','loading','empty','error'],create:['normal','validation','error'],editor:['normal','loading','empty','validation','success','conflict','protected','error','missing'],public:['normal','loading','empty','error'],article:['normal','loading','error','missing']}
      for(const item of $('state').options)item.disabled=!states[options.screen].includes(item.value)
      $('state').value=options.state
      $('caption').textContent='Approved design · Write / Preview tabs · Visual mockup'
      if(options.screen==='editor' && $('write-tab'))setEditorTab(options.tab)
      const query=new URLSearchParams({screen:options.screen,width:options.width,tab:options.tab})
      history.replaceState(null,'','?'+query)
    }
    function setState(state) { options.state=state;render() }
    let messageTimer
    function message(text) { $('message').textContent=text;$('message').hidden=false;clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('message').hidden=true,5000) }
    document.addEventListener('click',event=>{
      const target=event.target.closest('button,a');if(!target)return
      if(target.dataset.editorTab){setEditorTab(target.dataset.editorTab,true);return}
      if(target.dataset.width){options.width=target.dataset.width;render()}
      const screen=target.dataset.screen||target.dataset.go
      if(screen){event.preventDefault();options.screen=screen;options.state='normal';render()}
      if(target.dataset.demo){
        const action=target.dataset.demo
        if(action==='save')setState('success')
        else if(action==='inspect3')setState('protected')
        else if(action.startsWith('inspect'))setState('normal')
        else if(action==='retry')setState('normal')
        else if(action==='reload')message('Preview only: reloading would ask you to confirm replacement of local edits.')
        else if(action==='restore')message('Preview only: restoring would ask you to confirm replacement of unsaved edits.')
        else if(action==='delete')message('Preview only: deletion would require confirmation for this version.')
        else message('Preview only: no publication or database state was changed.')
      }
    })
    document.addEventListener('keydown',event=>{
      const tab=event.target.closest('[data-editor-tab]')
      if(!tab || !['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return
      event.preventDefault()
      const next=event.key==='Home'?'write':event.key==='End'?'preview':options.tab==='write'?'preview':'write'
      setEditorTab(next,true)
    })
    document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='create-form'){options.screen='editor';options.state='success';render()}})
    document.addEventListener('input',event=>{if(['source','draft-title','draft-tags'].includes(event.target.id))message('Preview only: field edits stay in this mockup; the rendered sample is fixed.')})
    $('state').addEventListener('change',event=>setState(event.target.value))
    render()
  </script>
</body>
</html>
